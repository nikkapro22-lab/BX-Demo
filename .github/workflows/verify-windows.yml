name: Verify Windows demo
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v0.1.0
permissions:
  contents: read
jobs:
  install-and-open:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download the release installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern '*-win-x64.exe' --dir download
      - name: Install and open the packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem download/*.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'bx-demo'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $executable = Join-Path $destination 'BX Demo.exe'
          if (!(Test-Path $executable)) { throw 'BX executable missing after installation' }
          $process = Start-Process -FilePath $executable -ArgumentList '--student-smoke' -PassThru
          if (!$process.WaitForExit(150000)) { Stop-Process -Id $process.Id -Force; throw 'BX startup timed out' }
          $log = Join-Path $env:APPDATA 'BX Student Demo/startup.log'
          Get-Content $log
          if ($process.ExitCode -ne 0 -or !(Select-String -Path $log -Pattern 'BX_STUDENT_SMOKE_PASS' -Quiet)) { throw 'BX packaged startup check failed' }
